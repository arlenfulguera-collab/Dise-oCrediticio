<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clientes | SistCrédito</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&family=Source+Serif+4:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/estilos.css">
  <link rel="stylesheet" href="../css/menu.css">
  <link rel="stylesheet" href="../css/clientes.css">
</head>
<body>
  <header class="barra">
    <p class="barra__logo">SistCrédito</p>
    <div class="barra__usuario">
      <p class="barra__datos">
        <span id="nombre-usuario" class="barra__nombre"></span>
        <span id="rol-usuario" class="barra__rol"></span>
      </p>
      <button type="button" id="cerrar-sesion" class="barra__salir">Cerrar sesión</button>
    </div>
  </header>

  <main class="contenido contenido--ancho">
    <a class="enlace-volver" href="../menu.html">Volver al menú</a>
    <h1 class="contenido__titulo">Clientes</h1>
    <p class="contenido__texto">Registra clientes nuevos y actualiza los datos de los que ya existen.</p>

    <div class="clientes">
      <section class="panel" aria-labelledby="titulo-form">
        <h2 id="titulo-form" class="panel__titulo">Registrar cliente</h2>

        <form id="form-cliente" novalidate>
          <div class="campo">
            <label for="ci">Cédula de identidad</label>
            <input id="ci" name="ci" type="text" placeholder="Ej. 6543210 LP" autocomplete="off">
          </div>

          <div class="campo">
            <label for="nombres">Nombres</label>
            <input id="nombres" name="nombres" type="text" autocomplete="off">
          </div>

          <div class="campo">
            <label for="apellidos">Apellidos</label>
            <input id="apellidos" name="apellidos" type="text" autocomplete="off">
          </div>

          <div class="campo">
            <label for="telefono">Teléfono</label>
            <input id="telefono" name="telefono" type="tel" autocomplete="off">
          </div>

          <div class="campo">
            <label for="correo">Correo electrónico (opcional)</label>
            <input id="correo" name="correo" type="email" autocomplete="off">
          </div>

          <div class="campo">
            <label for="direccion">Dirección (opcional)</label>
            <input id="direccion" name="direccion" type="text" autocomplete="off">
          </div>

          <div class="campo">
            <label for="ingresos">Ingresos mensuales (Bs)</label>
            <input id="ingresos" name="ingresos" type="number" min="0" step="0.01" inputmode="decimal">
          </div>

          <div class="campo" id="campo-estado" hidden>
            <label for="estado">Estado</label>
            <select id="estado" name="estado">
              <option value="ACTIVO">ACTIVO</option>
              <option value="INACTIVO">INACTIVO</option>
            </select>
          </div>

          <p id="mensaje" class="mensaje" role="status" aria-live="polite"></p>

          <div class="acciones">
            <button type="submit" id="boton-guardar" class="boton">Registrar cliente</button>
            <button type="button" id="boton-cancelar" class="boton boton--secundario" hidden>Cancelar</button>
          </div>
        </form>
      </section>

      <section class="panel" aria-labelledby="titulo-lista">
        <h2 id="titulo-lista" class="panel__titulo">Clientes registrados</h2>

        <div class="campo">
          <label for="buscar">Buscar por cédula o nombre</label>
          <input id="buscar" type="search" autocomplete="off">
        </div>

        <div class="tabla-contenedor">
          <table class="tabla">
            <caption class="solo-lectura">Lista de clientes registrados</caption>
            <thead>
              <tr>
                <th scope="col">Cédula</th>
                <th scope="col">Cliente</th>
                <th scope="col">Teléfono</th>
                <th scope="col" class="num">Ingresos (Bs)</th>
                <th scope="col">Estado</th>
                <th scope="col">Acción</th>
              </tr>
            </thead>
            <tbody id="tabla-clientes"></tbody>
          </table>
        </div>
        <p id="vacio" class="vacio" hidden></p>
      </section>
    </div>
  </main>

  <!-- CORREGIDO: Con los dos puntos (..) porque estamos dentro de la carpeta 'paginas' -->
  <script src="../js/sesion.js"></script>
  <script src="../js/datos.js"></script>
  <script src="../js/clientes.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aprobar o rechazar créditos | SistCrédito</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&family=Source+Serif+4:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/estilos.css">
  <link rel="stylesheet" href="../css/menu.css">
  <link rel="stylesheet" href="../css/clientes.css">
  <link rel="stylesheet" href="../css/solicitudes.css">
  <link rel="stylesheet" href="../css/pantallas.css">
</head>
<body>
  <header class="barra">
    <p class="barra__logo">SistCrédito</p>
    <div class="barra__usuario">
      <p class="barra__datos">
        <span id="nombre-usuario" class="barra__nombre"></span>
        <span id="rol-usuario" class="barra__rol"></span>
      </p>
      <button type="button" id="cerrar-sesion" class="barra__salir">Cerrar sesión</button>
    </div>
  </header>

  <main class="contenido contenido--ancho">
    <a class="enlace-volver" href="../menu.html">Volver al menú</a>
    <h1 class="contenido__titulo">Aprobar o rechazar créditos</h1>
    <p class="contenido__texto">Revisa las solicitudes evaluadas y decide según tu atribución.</p>

    <p id="mensaje-general" class="mensaje" role="status" aria-live="polite"></p>

    <div class="solicitudes">
      <section class="panel" aria-labelledby="titulo-lista">
        <h2 id="titulo-lista" class="panel__titulo">Solicitudes evaluadas</h2>
        <div class="tabla-contenedor">
          <table class="tabla">
            <caption class="solo-lectura">Solicitudes pendientes de decisión</caption>
            <thead>
              <tr>
                <th scope="col">N.º</th>
                <th scope="col">Cliente</th>
                <th scope="col" class="num">Monto (Bs)</th>
                <th scope="col" class="num">Plazo</th>
                <th scope="col">Riesgo</th>
                <th scope="col">Evaluación</th>
                <th scope="col">Acción</th>
              </tr>
            </thead>
            <tbody id="tabla-solicitudes"></tbody>
          </table>
        </div>
        <p id="vacio" class="vacio" hidden></p>
      </section>

      <section class="panel" id="panel-decision" aria-labelledby="titulo-decision" hidden>
        <h2 id="titulo-decision" class="panel__titulo"></h2>
        <dl class="detalle" id="detalle-decision"></dl>

        <div class="campo">
          <label for="motivo">Motivo del rechazo (obligatorio solo si rechazas)</label>
          <textarea id="motivo" rows="2"></textarea>
        </div>

        <p id="mensaje" class="mensaje" role="status" aria-live="polite"></p>
        <div class="grupo-botones">
          <button type="button" id="boton-aprobar" class="boton boton--auto">Aprobar crédito</button>
          <button type="button" id="boton-rechazar" class="boton boton--auto boton--rechazo">Rechazar crédito</button>
          <button type="button" id="boton-cerrar" class="boton boton--secundario boton--auto">Cerrar</button>
        </div>
      </section>
    </div>

  </main>

  <script src="../js/sesion.js"></script>
  <script src="../js/datos.js"></script>
  <script src="../js/aprobacion.js"></script>
</body>
</html>

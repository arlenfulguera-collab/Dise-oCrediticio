<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Desembolsos | SistCrédito</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&family=Source+Serif+4:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/estilos.css">
  <link rel="stylesheet" href="../css/menu.css">
  <link rel="stylesheet" href="../css/clientes.css">
  <link rel="stylesheet" href="../css/solicitudes.css">
  <link rel="stylesheet" href="../css/pantallas.css">
</head>
<body>
  <header class="barra">
    <p class="barra__logo">SistCrédito</p>
    <div class="barra__usuario">
      <p class="barra__datos">
        <span id="nombre-usuario" class="barra__nombre"></span>
        <span id="rol-usuario" class="barra__rol"></span>
      </p>
      <button type="button" id="cerrar-sesion" class="barra__salir">Cerrar sesión</button>
    </div>
  </header>

  <main class="contenido contenido--ancho">
    <a class="enlace-volver" href="../menu.html">Volver al menú</a>
    <h1 class="contenido__titulo">Desembolsos</h1>
    <p class="contenido__texto">Solicita al Core Bancario el desembolso de los créditos aprobados.</p>

    <p id="mensaje-general" class="mensaje" role="status" aria-live="polite"></p>

    <div class="solicitudes">
      <section class="panel" aria-labelledby="titulo-lista">
        <h2 id="titulo-lista" class="panel__titulo">Créditos</h2>
        <div class="tabla-contenedor">
          <table class="tabla">
            <caption class="solo-lectura">Lista de créditos</caption>
            <thead>
              <tr>
                <th scope="col">Crédito</th>
                <th scope="col">Cliente</th>
                <th scope="col" class="num">Monto (Bs)</th>
                <th scope="col" class="num">Plazo</th>
                <th scope="col">Estado</th>
                <th scope="col">Referencia Core</th>
                <th scope="col">Acción</th>
              </tr>
            </thead>
            <tbody id="tabla-creditos"></tbody>
          </table>
        </div>
        <p id="vacio" class="vacio" hidden></p>
      </section>

      <section class="panel" id="panel-desembolso" aria-labelledby="titulo-desembolso" hidden>
        <h2 id="titulo-desembolso" class="panel__titulo"></h2>
        <dl class="detalle" id="detalle-desembolso"></dl>

        <div class="campo">
          <label for="respuesta-core">Respuesta del Core Bancario (simulada para pruebas)</label>
          <select id="respuesta-core">
            <option value="CONFIRMA">Confirma el desembolso</option>
            <option value="RECHAZA">Rechaza el desembolso</option>
            <option value="NO_DISPONIBLE">No está disponible</option>
          </select>
        </div>

        <p id="mensaje" class="mensaje" role="status" aria-live="polite"></p>
        <div class="grupo-botones">
          <button type="button" id="boton-desembolsar" class="boton boton--auto">Solicitar desembolso</button>
          <button type="button" id="boton-cerrar" class="boton boton--secundario boton--auto">Cerrar</button>
        </div>
      </section>
    </div>

  </main>

  <script src="../js/sesion.js"></script>
  <script src="../js/datos.js"></script>
  <script src="../js/desembolsos.js"></script>
</body>
</html>
